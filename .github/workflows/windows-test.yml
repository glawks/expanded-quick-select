# EQS 2.0 development: Windows x64 test packages only. No release publishing.
name: EQS 2.0 Windows test

on:
  push:
    branches: ["2.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expanded-quick-select-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/2.0'
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Fetch and verify official OpenRAC Mod SDK
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Package platform mod
        env:
          PLATFORM: windows-x86_64
        run: |
          python "$SDK/tools/package_mod.py" build/package/* -o dist
          ls -lh dist
          python - <<'PY'
          import os
          from pathlib import Path
          archives = list(Path("dist").glob(f"*-{os.environ['PLATFORM']}.zip"))
          assert len(archives) == 1, f"Expected one archive for {os.environ['PLATFORM']}: {archives}"
          print("Verified package:", archives[0])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expanded-quick-select-${{ matrix.platform }}-test
          path: dist/*.zip
          if-no-files-found: error
